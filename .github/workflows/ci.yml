name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Lint markdown
        run: pnpm run lint:md

      - name: Test
        run: pnpm run test

      - name: Build hooks
        run: pnpm run build:hooks

      - name: Validate plugins
        run: pnpm run validate

      - name: Build standalone exports
        run: pnpm run build:standalone

      - name: Verify generated files are up to date
        run: |
          # dist/ exports and the committed source-installed plugin hooks
          # (plugins/*/hooks/{claude,codex}.json — the Gemini hooks.json is gitignored)
          # are generated by `pnpm run build`; all must be committed in sync with their sources.
          DIRTY=$(git status --porcelain -- dist/ ':(glob)plugins/*/hooks/*.json')
          if [ -n "$DIRTY" ]; then
            echo "::error::Generated files are out of date. Run 'pnpm run build' and commit the changes."
            echo "$DIRTY"
            exit 1
          fi
