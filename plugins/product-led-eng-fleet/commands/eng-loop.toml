description = "Run one iteration of the product-led engineering fleet orchestrator loop"
prompt = """
Run one iteration of the engineering fleet loop as the orchestrator, using the
product-led-eng-fleet skill (resources/orchestrator-loop.md).

Drive it through the deterministic engine — do not re-pull and diff issues in context:
1. git fetch origin <default-branch>; read the repo's fleet-conventions doc from the remote.
2. Run gh-queue `status` then `list` (from the github-fleet-tools plugin) for the ranked ready queue.
3. For each chosen issue: verify it reproduces, `gh-queue ground-truth <N>`, claim with
   `gh-label <N> add "in progress"` + `gh issue comment`, then dispatch a fleet implementer
   with a fully self-contained brief.
4. Monitor each PR by number; dispatch a fix pass on CI/review feedback (reply to every thread via
   gh-reviews reply); merge with `gh-merge <PR>` (prompts + guards) and close with gh issue close
   when green and resolved.

Never touch release/Version PRs. Don't manufacture work when the queue is saturated.
Report what you claimed, delegated, and merged.
"""
