description = "Mine the Bash history log for broad commands worth turning into purpose-built tools"
prompt = """
Analyze this project's Bash usage and propose purpose-built toolsmith scripts.
You propose — do not create scripts, edit the registry, or change permissions
in this command.

1. Load the history. Read .claude/toolsmith/history.jsonl (one JSON object per
   line: ts, cwd, command, exitCode). If it is missing or empty, say there is
   not yet enough signal and stop.

2. Focus on watched, broad commands. Consider the shipped watchlist
   (skills/toolsmith/references/watchlist-defaults.json) plus any project
   .claude/toolsmith/config.json overrides. Prioritize commands matching a
   watchlist pattern, long pipelines (multiple | stages, especially
   ... | jq ... | grep), and the same broad operation repeated with only small
   argument changes.

3. Cluster and rank. Group similar commands (normalize away volatile args like
   PR numbers, IDs, timestamps). Rank by frequency and by how awkward each is to
   allowlist as-is.

4. Apply the rubric. For each cluster, judge against
   skills/toolsmith/references/authoring-checklist.md (Compound / Missing /
   Guarded / Permission-scopable). Drop clusters that don't clear it.

5. Propose candidates. For each surviving cluster, output a concrete candidate:
   suggested name, one-line purpose, bounded args, scope, covers regex(es) that
   would match the observed commands, and a short script sketch. Note which
   existing registry tools (if any) already cover it.

End by inviting the user to pick candidates to build, then follow the toolsmith
skill's forging + approve flow for each.
"""
