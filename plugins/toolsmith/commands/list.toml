description = "Show the toolsmith registry and flag any approved tool whose file drifted from its pinned hash"
prompt = """
Show the state of both the project's and the user's purpose-built tools.

This command is a thin wrapper over the deterministic `toolsmith` CLI
(docs/toolsmith/cli-surface.md): the CLI computes the inventory, the drift
check, and the pending-drafts report; you relay its markdown verbatim.

1. Run:

   "${PLUGIN_ROOT}/scripts/toolsmith.mjs" list

2. Relay the output verbatim into chat as the completed result — it is
   relay-markdown: registry tables for both scopes with per-tool
   OK/DRIFTED/MISSING/draft/retired integrity status, pending staged drafts
   with their three-way drift state (pending / live-drifted-too /
   staged-missing / new), shadowing notes, and summary counts. A retired tool
   was revoked via the /toolsmith:approve command's revoke ceremony
   (toolsmith revoke <path> at the CLI): no live file, no grant — distinct
   from draft (never approved), since this one was live and was deliberately
   retired. Do not re-derive hashes, re-render tables, or add reasoning on
   top.

3. Only add commentary after the relayed output, and only when it is
   actionable: a PARSE ERROR for a scope means the hook is failing open there
   (redirect and tamper block disarmed) until the JSON is fixed; a DRIFTED
   tool will be blocked by the hook until re-promoted (/toolsmith:approve
   <path>, --user for a user tool); a live-drifted-too draft means promoting
   now would review a stale diff.
"""
