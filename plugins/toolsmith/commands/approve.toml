description = "Proofread-then-promote handshake that moves a purpose-built toolsmith staging draft to live"
prompt = """
Run the toolsmith promotion handshake for the tool registered at: {{args}}

This command couples an allowlist grant to one reviewed version of a script,
promoted from staging to live per docs/toolsmith/staged-live-split.md. The
mechanical, security-critical steps — reading the staged draft, placing it at
live, computing the sha256, pinning the registry entry, and granting the
permission rule — are performed by the deterministic `toolsmith` CLI, never
freehanded in prose. The commit run is a human act: you only ever run the
read-only preview.

1. Decide the scope. If the argument is (or normalizes to) a path meant to live
   under ~/.claude/toolsmith/tools/ — i.e. a bare name or a tools/<name> path
   that does not exist inside this project — this is a user-scope (global)
   tool: use --user on every CLI invocation below. Otherwise this is a
   project-scope tool: no --user flag.

2. Locate the registry entry. Read the registry for the chosen scope —
   .claude/toolsmith/registry.json (project) or ~/.claude/toolsmith/registry.json
   (user). Find the entry whose (live) `path` matches the argument. The CLI
   refuses to run against a path with no registry entry, or against an entry
   with no `staged` field — it never invents name/purpose/args/scope/covers/staged
   on your behalf. If no entry or no staged draft exists, stop: the draft must
   be authored under the staging namespace first (see
   skills/toolsmith/references/authoring-checklist.md).

3. Preview. Run:

   "${PLUGIN_ROOT}/scripts/toolsmith.mjs" approve "<path>" --dry-run

   (add --user for a user-scope tool). This is a read-only dry run — it writes
   nothing. It also runs the proposal gate (toolsmith lint) over the staged
   draft and refuses if the draft has lint errors; fix those in staging first.
   Show its output to the user verbatim: the tool name, whether this is a new
   tool or a revision, the review surface (a diff against current live for a
   revision, the full staged text for a new tool — exactly what would be
   placed), the computed sha256 of the staged bytes, any lint warnings, and
   the exact Bash(...:*) rule that would be granted.

4. Hand the promotion command to the user — never run it yourself. The commit
   run is a human act performed in the user's own terminal (the toolsmith
   hooks deny agent-run commit invocations; only read-only verbs pass). Print
   the exact command with the plugin root expanded to its real absolute path
   so it is copy-pasteable:

   "<absolute-plugin-root>/scripts/toolsmith.mjs" approve "<path>"

   (with --user for a user-scope tool). `toolsmith approve --help` is written
   for that human and explains exactly what the commit does: place the staged
   bytes atomically, set the live file to 0555 plus the BSD immutable flag
   where available, recompute the sha256 from the placed bytes and pin it as
   approvedSha256, add exactly one Bash(...:*) rule to the scope's
   settings.json permissions.allow (.claude/settings.json for project scope,
   ~/.claude/settings.json for user scope; no-op if already present), clear
   the entry's staged field, and remove the staging file. It is fail-closed
   and idempotent: interrupted promotions leave live refused-closed until a
   re-run, and re-running converges rather than double-applying.

   If the user declines or wants changes, stop — the draft stays in staging,
   inert, and the previous live version (if any) keeps serving every
   invocation untouched.

   If this project has run `toolsmith approve --setup` (project scope only —
   see "Setting up the attest-it admission gate" below), the commit run
   additionally SEALS and VERIFIES an attest-it admission
   (docs/toolsmith/attest-it-admission.md) before it places anything. What
   that looks like depends on where the promotion command is actually run:
   - In the user's own interactive terminal (the normal case — the toolsmith
     hooks deny an agent-run commit invocation entirely, so this is how the
     commit run reaches this step today): it runs
     `attest-it run --suite toolsmith-admission` right there, inline — the
     presence prompt is already in the user's own TTY, so there is nothing
     further to hand off.
   - Non-interactively (no TTY — a defense-in-depth path, not one an agent
     can reach today): it never runs the seal command itself. It prints the
     exact `attest-it run --suite toolsmith-admission` command and polls for
     a seal produced in a SEPARATE terminal of the user's own, never hosting
     the presence prompt itself (the agent-never-intermediary rule). If you
     (the agent) ever see this message, tell the user to run that command in
     their own terminal, then re-run the promotion command.

   A missing, stale (edited-since-sealed), or wrong-signer seal refuses the
   whole promotion with a distinct message; nothing is written.

5. Verify and report. Once the user says they've run it, confirm the promotion
   landed with the read-only check:

   "${PLUGIN_ROOT}/scripts/toolsmith.mjs" verify

   (add --user for user scope) and report what was promoted, the pinned hash,
   and the rule added. For a user-scope tool, remind the user it must be
   invoked by its fully-expanded absolute path so the granted rule matches.
   Remind the user that any future change to this tool must go back through
   staging — author the revision there and repeat this handshake; the live
   version never accepts a direct edit.

## Revoking (retiring) a tool

toolsmith revoke is the symmetric inverse: it retires a tool that is no
longer wanted, per docs/toolsmith/staged-live-split.md §Promotion, "Demotion/
retirement". It goes through the same proofread-then-confirm ceremony as
promotion — never run it without the user's explicit confirmation in this
turn.

1. Decide the scope, same as promotion (step 1 above): --user for a bare name
   or tools/<name> path resolving under ~/.claude/toolsmith/tools/, otherwise
   project scope.

2. Preview. Run:

   "${PLUGIN_ROOT}/scripts/toolsmith.mjs" revoke "<path>" --dry-run

   (add --user for a user-scope tool). Read-only — writes nothing. Show the
   user the tool's name, current status, the exact permission rule that would
   be removed, and whether the live file would be removed. If the entry is
   already retired (or doesn't exist), this reports that revoking it is
   already a no-op — nothing to confirm.

3. Confirm. Ask the user to confirm they want this tool retired: the
   permission rule removed and the live file deleted. If they decline, stop —
   nothing changes.

4. On confirmation only, hand the revoke command to the user — never run it
   yourself. Same human-act discipline as promotion (the toolsmith hooks deny
   agent-run commit invocations; only read-only verbs pass). Print the exact
   command with the plugin root expanded to its real absolute path:

   "<absolute-plugin-root>/scripts/toolsmith.mjs" revoke "<path>"

   (with --user for a user-scope tool). This removes the Bash(...:*) rule
   from the scope's settings.json first (so there is never a moment where a
   rule grants a path that's about to stop existing), then marks the registry
   entry status: "retired" (this is also the steering de-registration —
   steering only honors "approved" entries), then clears the BSD immutable
   flag where available and removes the live file. The entry itself is kept
   (not deleted) so its history — what it was, its pinned hash, the rule it
   once held — stays auditable. Fail-closed and idempotent, same discipline
   as promotion: revoking an already-retired or unknown tool is a clean
   no-op, not an error; a kill mid-revoke never leaves a stale grant, and
   re-running converges.

5. Report what was removed (rule / registry status / live file), or that it
   was already fully retired. Confirm with toolsmith verify (add --user for
   user scope) that the tool now reports retired.

## Setting up the attest-it admission gate (project scope, one-time)

Per docs/toolsmith/attest-it-admission.md (issue #76) and D-018
(docs/harness-program/DECISIONS.md), a project may opt into requiring a
cryptographic, presence-backed human seal before every promotion. This is
entirely optional and additive — a project that skips it keeps today's
pin-only ceremony forever.

If the user asks to set this up: they must already have an attest-it identity
(attest-it identity create) backed by 1Password or a YubiKey — never run
attest-it identity create or the setup command yourself; both require the
user's own presence action. Once they have an identity, run the one-time
scaffold only after the user confirms they want it:

   "${PLUGIN_ROOT}/scripts/toolsmith.mjs" approve --setup

This is idempotent and safe to re-run. It refuses (AC3a) if the active
identity's key isn't presence-backed, and refuses to silently re-pin to a
different identity — rotating the signer is a human decision (remove
.attest-it/toolsmith-admission-signer.json explicitly first). Like the commit
run, this is a human act — the toolsmith hooks deny agent-run invocations of
it too; you only ever explain what it does and let the user run it.
"""
