name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  CI:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager — do not duplicate here

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugins
        run: pnpm exec aipm build

      - name: Verify the tree is clean after build (freshness)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after 'aipm build'. Run 'aipm build' locally and commit the regenerated artifacts."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Validate plugins
        run: pnpm exec aipm validate

      - name: Run unit tests (pnpm test)
        run: pnpm test

      - name: Run markdown lint (pnpm lint)
        run: pnpm lint

      - name: Install toon CLI
        # The toon hook suite drives the real `toon` binary (not a mock), so
        # it must be present on the runner. Pinned to major 2 to match the
        # locally-developed-against version (2.3.0) while still picking up
        # patch/minor fixes.
        run: npm install -g @toon-format/cli@2

      - name: Assert hook regression suite dependencies are present
        # The suites below skip cleanly (exit 0, no assertions run) when jq is
        # missing, so a jq-less runner image would otherwise report green
        # while testing nothing. Fail loudly here instead of silently. toon
        # is asserted too: if the install step above is ever removed or
        # breaks, conversions would silently no-op (pass-through) instead of
        # being skipped, so this must fail the build, not just the suite.
        run: |
          command -v jq >/dev/null 2>&1 || {
            echo "::error::jq is required by the hook regression suites but is not installed on this runner image."
            exit 1
          }
          command -v node >/dev/null 2>&1 || {
            echo "::error::node is required by the hook regression suites but is not installed on this runner image."
            exit 1
          }
          command -v toon >/dev/null 2>&1 || {
            echo "::error::toon (@toon-format/cli) is required by the toon hook regression suite but is not installed on this runner image."
            exit 1
          }

      - name: Run hook regression suites
        # Enumerate suite paths here — adding a new test file to an existing
        # suite requires no change to this workflow, only new suites do.
        run: |
          suites=(
            "plugins/toolsmith/scripts/test.sh"
            "plugins/toolsmith/scripts/test-approve.sh"
            "plugins/toon/scripts/test.sh"
          )
          status=0
          for suite in "${suites[@]}"; do
            echo "::group::${suite}"
            if ! bash "${suite}"; then
              echo "::error::${suite} failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"
