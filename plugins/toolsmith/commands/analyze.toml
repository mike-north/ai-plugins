description = "Mine the Bash history log for broad commands worth turning into purpose-built tools"
prompt = """
Analyze this project's Bash usage and propose purpose-built toolsmith scripts.
You propose — do not create scripts, edit the registry, or change permissions
in this command.

The deterministic half is the `toolsmith` CLI's job
(docs/toolsmith/cli-surface.md): it inventories the history log, clusters and
counts, and classifies against the effective watchlist and existing tools'
covers patterns. Your job is the judgment layer on top.

1. Run the miner:

   "${PLUGIN_ROOT}/scripts/toolsmith.mjs" analyze

   Relay its markdown verbatim — cluster tables, watched-but-uncovered
   candidates, counts. Do not read history.jsonl directly or re-derive
   frequencies in prose: the log stores commands verbatim and can contain
   inline secrets, so the hook denies raw reads; the CLI's output is already
   normalized and secret-redacted. (For individual raw lines beyond what the
   miner reports, the redacting reader
   node "${PLUGIN_ROOT}/scripts/toolsmith-history.mjs" [--grep <regex>] [--limit <N>]
   is the only sanctioned path.) If the miner reports "not enough signal",
   say so and stop.

2. Apply the rubric. For each cluster the CLI surfaced (prioritizing
   watched-but-uncovered, then high-frequency, then long pipelines), judge
   against skills/toolsmith/references/authoring-checklist.md (Compound /
   Missing / Guarded / Permission-scopable). Drop clusters that don't clear
   it.

3. Propose candidates. For each surviving cluster, output a concrete candidate:
   suggested name, one-line purpose, bounded args, scope, covers regex(es) that
   would match the observed commands, and a short script sketch. Note which
   existing registry tools (if any) already cover it.

End by inviting the user to pick candidates to build. For each pick, dispatch
one tool-curator agent, passing that candidate's block (name, purpose, covers,
sketch, and the observed commands it was clustered from) as its capability
brief. The curator re-adjudicates from scratch — this command's clustering
never checks native porcelain, so a no-tool-needed verdict is possible and
correct even for a candidate that looked solid here. This command only
proposes; the curator (via a staging draft) and the human via
/toolsmith:approve are what actually change anything.
"""
