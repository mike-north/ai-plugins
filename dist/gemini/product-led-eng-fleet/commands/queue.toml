description = "Show the ranked ready queue and fleet status (deterministic, via the engine)"
prompt = """
Show the current fleet work queue using the deterministic engine, not by reading and
diffing issues in context.

Run gh-queue `status` then `list` (from the github-fleet-tools plugin) and present the ranked
ready queue (deadline → priority → number) plus the rollup (ready / in-progress / open PRs). If an
issue number was given, also run `gh-queue ground-truth <N>` and report whether it is safe to claim.

This command is read-only — do not claim or modify anything.
"""
