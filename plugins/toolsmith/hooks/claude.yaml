hooks:
  PreToolUse:
    - matcher: Bash
      hooks:
        - type: command
          command: ${CLAUDE_PLUGIN_ROOT}/scripts/toolsmith-gate.sh
    - matcher: Write|Edit|NotebookEdit
      hooks:
        - type: command
          command: ${CLAUDE_PLUGIN_ROOT}/scripts/toolsmith-write-gate.sh
  PostToolUse:
    - matcher: Bash
      hooks:
        - type: command
          command: ${CLAUDE_PLUGIN_ROOT}/scripts/toolsmith-log.sh
